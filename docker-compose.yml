version: "3"

services:
    db:
        image: postgres:14-alpine
        restart: always
        ports:
            - ${DB_PORT}:${DB_PORT}
        environment:
            - POSTGRES_USER=${DB_USERNAME}
            - POSTGRES_PASSWORD=${DB_PASSWORD}
            - POSTGRES_DB=${DB_DATABASE}
    adminer:
        image: adminer
        restart: always
        ports:
            - 8080:8080
